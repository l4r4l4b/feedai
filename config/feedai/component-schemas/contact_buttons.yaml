type: contact_buttons
label: Contact Buttons
description: 2-spaltiges Grid mit Direct-Contact-Channels.
fields:
  section_label:
    type: string
    required: false
    max: 40
  buttons:
    type: array
    required: true
    item_fields:
      - channel (enum: whatsapp|line|facebook|call, required)
      - value (string, required) — Nummer / URL / Username
      - label (string, optional)
