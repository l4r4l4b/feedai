type: opening_hours
label: Opening Hours
description: List of days/day-groups with their times.
agent:
  purpose: When can guests visit, book, or get service.
  use_when:
    - Vendor mentions specific days + times.
    - Required for any feed where timing matters (food, massage, retail).
  avoid_when:
    - 24/7 services where hours aren't meaningful — skip or use a `highlight_card`.
  examples:
    - "open monday to friday 5 to 11pm → hours=[{days:\"Mon–Fri\", time:\"17:00–23:00\"}]"
    - "weekdays 10am to 8pm, weekends 12 to 10pm → hours=[{days:\"Mon–Fri\", time:\"10:00–20:00\"}, {days:\"Sat–Sun\", time:\"12:00–22:00\"}]"
fields:
  section_label:
    type: string
    required: false
    max: 40
  hours:
    type: array
    required: true
    item_fields:
      - days (string, required) — e.g. "Mon–Fri" or "Sat"
      - time (string, required) — e.g. "17:00–23:00" or "Closed"
  note:
    type: string
    required: false
    max: 160
    description: Footnote under the times, e.g. "Closed on public holidays"
