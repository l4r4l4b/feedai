type: hero
label: Hero
description: Vendor-Aufmacher — großes 3:4 Foto mit Text-Overlay (Location, Name, Rating).
fields:
  image:
    type: image
    required: true
    ratio: "3:4"
    description: Großes Vendor-Foto, 3:4 Hochformat, Overlay liegt drauf
  title:
    type: string
    required: true
    max: 80
    description: Vendor-Name (display-prominent im Overlay)
  location:
    type: string
    required: false
    max: 80
    description: Standort-Zeile mit Pin, z.B. "Khao San Road · Bangkok"
  rating:
    type: string
    required: false
    max: 32
    description: Display-Bewertung als Static-String, z.B. "4.95 (203)"
