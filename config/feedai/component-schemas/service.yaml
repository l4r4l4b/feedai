type: service
label: Service
description: Einzelne Dienstleistung mit Bild (16:10), Titel, Meta-Row und Arrow-Button-CTA.
fields:
  image:
    type: image
    required: true
    ratio: "16:10"
  title:
    type: string
    required: true
    max: 80
  meta:
    type: string
    required: false
    max: 80
    description: Zusatzinfo wie Dauer, Treffpunkt
  rating:
    type: string
    required: false
    max: 32
    description: Static-Bewertung, z.B. "4.96"
  price:
    type: string
    required: true
    max: 32
  cta_url:
    type: string
    required: true
    description: Link-Target für den Arrow-Button
