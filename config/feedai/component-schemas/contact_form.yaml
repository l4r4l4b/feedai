type: contact_form
label: Contact Form
description: Tourist→vendor message form with invisible AI translation bridge in both directions.
agent:
  purpose: A way for guests to start a conversation that the vendor reads in their own language.
  use_when:
    - Vendor wants written inquiries (longer questions, custom booking requests).
    - Higher-value services (tour planning, custom catering, multi-day bookings).
  avoid_when:
    - Simple "call me" use cases — `contact_buttons` is faster.
    - Vendor already covers contact via WhatsApp — don't add a form unless explicitly wanted.
  examples:
    - "I want guests to send me detailed inquiries about custom tours → title=\"Tell me about your trip\", intro=\"Custom tours start with a chat. Tell me what you're after and I'll come back within a day.\""
fields:
  section_label:
    type: string
    required: false
    max: 40
  title:
    type: string
    required: false
    max: 80
    default: Contact
  intro:
    type: string
    required: false
    max: 200
  submit_label:
    type: string
    required: false
    max: 32
    default: Send
