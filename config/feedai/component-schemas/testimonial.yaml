type: testimonial
label: Testimonial
description: One customer quote with author name and optional role/trip context.
agent:
  purpose: Social proof through a single, well-chosen guest voice.
  use_when:
    - Vendor mentions specific positive feedback from a named guest.
    - High-trust services (tours, classes, premium dining).
  avoid_when:
    - Vendor doesn't have a real quote — never fabricate testimonials.
    - Multiple voices wanted — pick the best ONE; this component holds a single quote.
  examples:
    - "Lena from Germany said our cooking class was the best part of her trip → quote=\"The cooking class was the best part of our trip.\", author=\"Lena & Tom\", role=\"Berlin, Germany\""
fields:
  quote:
    type: string
    required: true
    max: 320
  author:
    type: string
    required: true
    max: 80
  role:
    type: string
    required: false
    max: 80
    description: Role / trip / country
